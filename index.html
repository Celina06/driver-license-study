<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#183f82"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"><title>운전면허 기출 핵심풀이 학습 v12</title></head><body><main><header><h1>운전면허 기출학습 <small class="version">v12</small></h1><div id="stats"></div></header><div class="filters"><select id="category" aria-label="주제"></select><select id="difficulty" aria-label="난이도"><option value="all">전체 난이도</option><option value="unrated">미분류만</option><option value="high">상 · 어려움</option><option value="mid">중 · 헷갈림</option><option value="low">하 · 익숙함</option><option value="wrong">틀린 문제</option></select></div><div class="control"><label class="visual-toggle"><input type="checkbox" id="includeVisual"> 그림 문제 포함</label><button id="restart">새 회차</button></div><p id="roundToast" class="hint" role="status"></p><section class="paper" id="study"><div class="eyebrow" id="position"></div><div class="eyebrow" id="topic" hidden></div><p id="visualNotice" class="review-flag" hidden>⚠ 원본 PDF의 사진·상황 또는 보기 배열 확인이 필요한 문제입니다. 시각자료가 누락되었을 수 있으니 답을 외우기 전에 원본을 확인하세요.</p><h2 id="question"></h2><div id="scene" class="scene" hidden></div><img id="questionImage" class="question-image" alt="원본 문제 그림" hidden><div id="options" class="options"></div><button id="check" class="primary">정답 확인</button><section id="result" hidden><div id="verdict"></div><div class="memo"><strong>핵심 풀이</strong><div id="memo"></div><small id="memoSource" hidden></small></div><p id="ratingStatus" class="hint"></p><div class="ratings"><button data-rate="high">상 · 어려움</button><button data-rate="mid">중 · 헷갈림</button><button data-rate="low">하 · 익숙함</button></div></section></section><section id="empty" class="paper" hidden></section><div class="nav"><button id="prev">← 이전</button><button id="next">다음 →</button></div><details class="tools"><summary>학습기록 백업 · 복원 · 초기화</summary><
